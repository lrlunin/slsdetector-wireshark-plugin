name: RPM

# Builds one RPM per RHEL release for the Wireshark that release ships.
# Called by release.yml; on tagged releases rpm-repo.yml signs them and adds
# them to the dnf repository. Pull requests keep them as workflow artifacts.
# Can also be run by hand.
#
# RHEL 7 is not covered: it ships Wireshark 1.10, older than the plugin API.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rpm:
    name: RPM / ${{ matrix.dist }} / Wireshark ${{ matrix.ws }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dist: el8, image: 'almalinux:8', ws: '2.6' }
          - { dist: el9, image: 'almalinux:9', ws: '3.4' }

    steps:
      # git before checkout, so it clones with history and tags for git describe
      - name: Install build dependencies
        run: dnf install -y gcc /usr/bin/pkg-config 'pkgconfig(glib-2.0)' /usr/bin/curl tar zip rpm-build git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Wireshark only loads plugins built for its own major.minor, so fail
      # if the distribution moved to another release line than the matrix says.
      - name: Check distribution Wireshark version
        run: |
          read -r epoch version < <(dnf -q repoquery --latest-limit 1 \
            --qf '%{epoch} %{version}\n' wireshark-cli)
          echo "wireshark-cli in ${{ matrix.dist }} repos: $epoch:$version"
          line="$(echo "$version" | cut -d. -f1,2)"
          if [ "$line" != "${{ matrix.ws }}" ]; then
            echo "::error::${{ matrix.dist }} ships Wireshark $version, expected ${{ matrix.ws }}.x; update the matrix in rpm.yml"
            exit 1
          fi
          echo "WS_EPOCH=$epoch" >> "$GITHUB_ENV"

      # Tag v1.2.0          -> slsdet-wireshark-1.2.0-1
      # 3 commits past it   -> slsdet-wireshark-1.2.0-1.3.gabc1234 (git describe),
      #                        newer than 1.2.0-1 and older than the next release
      - name: Plugin version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RPM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RPM_RELEASE=1" >> "$GITHUB_ENV"
          else
            desc="$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null \
              || echo "v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)")"
            [[ "$desc" =~ ^v(.+)-([0-9]+)-g([0-9a-f]+)$ ]] || { echo "bad describe: $desc" >&2; exit 1; }
            echo "PLUGIN_VERSION=${desc#v}" >> "$GITHUB_ENV"
            echo "RPM_VERSION=${BASH_REMATCH[1]//-/_}" >> "$GITHUB_ENV"
            echo "RPM_RELEASE=1.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
          fi
          cat "$GITHUB_ENV"

      - name: Build plugin
        env:
          CC: gcc
        run: bash ci/build.sh "${{ matrix.ws }}" linux dist

      - name: Build RPM
        run: |
          mkdir -p rpmsrc
          cp "dist/slsdet-wireshark-${{ matrix.ws }}-linux-x86_64.so" rpmsrc/slsdet.so
          cp README.md rpmsrc/
          rpmbuild -bb rpm/slsdet-wireshark.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "_sourcedir $PWD/rpmsrc" \
            --define "plugin_version $RPM_VERSION" \
            --define "plugin_release $RPM_RELEASE" \
            --define "ws_line ${{ matrix.ws }}" \
            --define "ws_epoch $WS_EPOCH"
          mkdir -p rpms
          cp rpmbuild/RPMS/x86_64/*.rpm rpms/
          rpm -qpil --requires rpms/*.rpm

      # Installing pulls in the distribution's wireshark-cli through the
      # version-pinned Requires; tshark must then list the plugin.
      - name: Install and load test
        run: |
          dnf install -y rpms/*.rpm
          tshark -G plugins | tee plugins.txt
          grep -q '^slsdet\.so' plugins.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slsdet-wireshark-rpm-${{ matrix.dist }}
          path: rpms/*.rpm
          if-no-files-found: error
