name: Build & Release

# Every push to main: build all 9 plugins and the RHEL RPMs (kept as
#                      workflow artifacts).
# Push a tag "v*":     build them, publish a GitHub release with the
#                      9 libraries attached, and add the RPMs to the dnf
#                      repository on GitHub Pages (rpm-repo.yml).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} / Wireshark ${{ matrix.ws }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        ws: ['2.6', '3.6', '4.6']
        platform: [linux, windows, macos]
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Plugin version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PLUGIN_VERSION=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------- Linux
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libglib2.0-dev pkg-config zip

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        env:
          CC: gcc
        run: bash ci/build.sh "${{ matrix.ws }}" linux dist

      # ---------------------------------------------------------- macOS
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install glib pkgconf

      - name: Build (macOS, universal x86_64 + arm64)
        if: matrix.platform == 'macos'
        env:
          CC: clang
        run: bash ci/build.sh "${{ matrix.ws }}" macos dist

      # ---------------------------------------------------------- Windows
      - name: Set up MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pkgconf
            curl
            tar
            zip

      - name: Build (Windows x64)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: bash ci/build.sh "${{ matrix.ws }}" windows dist

      # ---------------------------------------------------------- artifact
      - uses: actions/upload-artifact@v4
        with:
          name: slsdet-wireshark-${{ matrix.ws }}-${{ matrix.platform }}
          path: |
            dist/*.so
            dist/*.dll
          if-no-files-found: error

  rpm:
    uses: ./.github/workflows/rpm.yml

  # One check run per platform ("Linux", "Windows", "macOS") for the README
  # badges: green only if all three Wireshark builds of that platform passed.
  status:
    name: ${{ matrix.name }}
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        include:
          - { platform: linux,   name: Linux }
          - { platform: windows, name: Windows }
          - { platform: macos,   name: macOS }
    steps:
      - name: Check ${{ matrix.name }} builds
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: "${{ matrix.platform }} /"
        run: |
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.name | startswith(env.PREFIX)) | "\(.conclusion) \(.name)"' \
            | tee jobs.txt
          test "$(wc -l < jobs.txt)" -eq 3
          if grep -v '^success ' jobs.txt; then exit 1; fi

  release:
    name: Publish release
    needs: [build, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect libraries
        run: |
          mkdir release
          cp dist/*.so dist/*.dll release/
          cd release
          ls -l
          n=$(ls | wc -l)
          if [ "$n" -ne 9 ]; then echo "expected 9 libraries, got $n" >&2; exit 1; fi
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          SLS detector dissector for Wireshark.

          | Wireshark | Linux (x86_64) | Windows (x64) | macOS (Intel + Apple Silicon) |
          |---|---|---|---|
          | 2.6.x | `slsdet-wireshark-2.6-linux-x86_64.so` | `slsdet-wireshark-2.6-windows-x64.dll` | `slsdet-wireshark-2.6-macos-universal.so` |
          | 3.6.x | `slsdet-wireshark-3.6-linux-x86_64.so` | `slsdet-wireshark-3.6-windows-x64.dll` | `slsdet-wireshark-3.6-macos-universal.so` |
          | 4.6.x | `slsdet-wireshark-4.6-linux-x86_64.so` | `slsdet-wireshark-4.6-windows-x64.dll` | `slsdet-wireshark-4.6-macos-universal.so` |

          Pick the file matching your Wireshark major.minor version (Help > About)
          and copy it into your personal plugin folder:

          | Platform | Folder |
          |---|---|
          | Linux   | `~/.local/lib/wireshark/plugins/X.Y/epan/` |
          | Windows | `%APPDATA%\Wireshark\plugins\X.Y\epan\` |
          | macOS   | `~/.local/lib/wireshark/plugins/X-Y/epan/` (`2.6` for 2.6, `3-6` / `4-6` for newer) |

          Restart Wireshark; the plugin is listed under Help > About Wireshark > Plugins.
          On macOS, run `xattr -d com.apple.quarantine <file>` after downloading with a browser.

          **RHEL / AlmaLinux / Rocky 8 and 9:** install from the dnf repository instead:

          ```
          sudo dnf config-manager --add-repo https://slsdetectorgroup.github.io/slsdetector-wireshark-plugin/el$(rpm -E %rhel)/slsdet.repo
          sudo dnf install slsdet-wireshark
          ```
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

  rpm-repo:
    needs: [rpm, release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/rpm-repo.yml
    secrets: inherit
