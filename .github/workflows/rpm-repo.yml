name: RPM repository

# Signs the RPMs built by rpm.yml and adds them to the dnf repository served
# by GitHub Pages from the gh-pages branch:
#
#   https://<owner>.github.io/<repo>/
#     RPM-GPG-KEY-slsdet
#     el8/  slsdet.repo  repodata/  *.el8.x86_64.rpm
#     el9/  slsdet.repo  repodata/  *.el9.x86_64.rpm
#     el10/ slsdet.repo  repodata/  *.el10.x86_64.rpm
#
# Earlier releases stay in the repository (dnf downgrade works).
#
# Secrets:
#   RPM_GPG_PRIVATE_KEY  ASCII-armored secret key used for RPMs and repodata
#   RPM_GPG_PASSPHRASE   its passphrase (may be empty)
on:
  workflow_call:
    secrets:
      RPM_GPG_PRIVATE_KEY:
        required: true
      RPM_GPG_PASSPHRASE:
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish RPM repository
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Install tools
        run: dnf install -y createrepo_c rpm-sign gnupg2 git

      - uses: actions/download-artifact@v4
        with:
          pattern: slsdet-wireshark-rpm-*
          path: rpms
          merge-multiple: true

      - name: Import signing key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$RPM_GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          # rpmsign calls gpg itself; let every gpg call sign without a prompt
          printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/passphrase" > "$GNUPGHOME/gpg.conf"
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          test -n "$fpr" || { echo "::error::RPM_GPG_PRIVATE_KEY holds no secret key" >&2; exit 1; }
          echo "GPG_FPR=$fpr" >> "$GITHUB_ENV"

      - name: Check out gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi

      - name: Sign RPMs and update repositories
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="https://$owner.github.io/${GITHUB_REPOSITORY#*/}"

          rpmsign --define "_gpg_name $GPG_FPR" --addsign rpms/*.rpm </dev/null
          gpg --armor --export "$GPG_FPR" > site/RPM-GPG-KEY-slsdet
          touch site/.nojekyll

          for el in el8 el9 el10; do
            ls rpms/*."$el".x86_64.rpm >/dev/null
            mkdir -p "site/$el"
            cp rpms/*."$el".x86_64.rpm "site/$el/"
            createrepo_c --update "site/$el"
            gpg --batch --yes --detach-sign --armor "site/$el/repodata/repomd.xml"
            cat > "site/$el/slsdet.repo" <<EOF
          [slsdet-wireshark]
          name=SLS detector Wireshark plugin ($el)
          baseurl=$base/$el/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=$base/RPM-GPG-KEY-slsdet
          EOF
          done

          cat > site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>slsdet-wireshark RPM repository</title>
          <h1>slsdet-wireshark RPM repository</h1>
          <p>RHEL / AlmaLinux / Rocky Linux 8, 9 and 10:</p>
          <pre>sudo dnf config-manager --add-repo $base/el\$(rpm -E %rhel)/slsdet.repo
          sudo dnf install slsdet-wireshark</pre>
          <p><a href="el8/">el8</a> &middot; <a href="el9/">el9</a> &middot; <a href="el10/">el10</a> &middot;
          <a href="RPM-GPG-KEY-slsdet">RPM-GPG-KEY-slsdet</a></p>
          EOF
          find site -path site/.git -prune -o -type f -print | sort

      - name: Push gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RPM repository: $GITHUB_REF_NAME"
          git push origin gh-pages
